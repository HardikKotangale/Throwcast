<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Throwcast</title>
  <link rel="stylesheet" href="style.css">
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <object id="av" type="application/avplayer"></object>
  <video id="player" autoplay tabindex="-1"></video>
  <main id="idle">
    <img id="logo" src="logo.png" alt="">
    <h1>Throwcast</h1>
    <p id="status">Looking for your Mac</p>
    <p id="detail">Choose this TV in Throwcast on your Mac</p>
    <div id="dots"><i></i><i></i><i></i></div>
  </main>
  <aside id="hud" hidden></aside>
  <aside id="pair" hidden>
    <p id="pair-title">Allow an iPhone to control Throwcast</p>
    <p id="pair-code"></p>
    <p id="pair-detail">Type this code in Throwcast Remote</p>
  </aside>
  <script src="main.js"></script>
  <script src="player.js"></script>
</body>
</html>
